name: Skylit
options:
  bundleIdPrefix: com.iframed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SkylitCore:
    path: SkylitCore
targets:
  Skylit:
    type: application
    platform: iOS
    sources:
      - path: Skylit
    dependencies:
      - package: SkylitCore
    info:
      path: Skylit/Info.plist
      properties:
        CFBundleDisplayName: iFramed You
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: iFramed You finds your photo frame on this Wi-Fi so you can manage chores, shopping, photos and setup.
        NSBonjourServices: [_skylit._tcp]
        NSLocationWhenInUseUsageDescription: iFramed You uses your location once to set the city for the frame's weather.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iframed.you
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z9Q998MK8P
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_USER_SCRIPT_SANDBOXING: YES
